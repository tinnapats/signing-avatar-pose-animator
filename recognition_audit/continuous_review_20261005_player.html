<!doctype html><html lang="th"><meta charset="utf-8"><title>เปรียบเทียบการเคลื่อนไหวสามแบบ</title>
<style>body{font:16px system-ui;background:#eef2f5;color:#182b3e;max-width:1300px;margin:24px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}img{width:100%;display:block;background:white}button,select,input{font:inherit;margin:8px;padding:8px}.controls{display:flex;flex-wrap:wrap;align-items:center}input{flex:1}h2{font-size:18px}figure{margin:0}figcaption{padding:10px}p{line-height:1.6}</style>
<h1>ตรวจการเคลื่อนไหวต่อเนื่อง</h1><p>ภาพจาก Canvas จริงทั้งคลิปที่ 30 FPS — เล่นพร้อมกันหรือเลื่อนทีละเฟรมได้ ไม่มีการวนกลับต้นคลิปอัตโนมัติ ชุดนี้เป็นคำวินิจฉัยเดิม ไม่ใช่ชุดใหม่ 100 คำ</p>
<div class="controls"><label>คำ <select id="word"><option>parents</option><option>chicken</option><option>class</option></select></label><button id="play">เล่น</button><button id="prev">ก่อนหน้า</button><button id="next">ถัดไป</button><label>ความเร็ว <select id="speed"><option value="1">1×</option><option value=".25">0.25×</option></select></label><input id="frame" aria-label="เฟรม" type="range" min="0" value="0"><output id="counter"></output></div>
<div class="grid"><figure><figcaption>แบบเดิม</figcaption><img alt="แบบเดิม"></figure><figure><figcaption>ขนาดมือ payload</figcaption><img alt="ขนาดมือ payload"></figure><figure><figcaption>ขนาดมือ payload + หมุนจำกัด</figcaption><img alt="หมุนจำกัด"></figure></div><p id="status" role="status"></p>
<script>
const lengths={parents:31,chicken:90,class:121},modes=['BASE','SIZE_ONLY','BOUNDED_SIZE'];const word=document.querySelector('#word'),slider=document.querySelector('#frame'),play=document.querySelector('#play'),speed=document.querySelector('#speed'),counter=document.querySelector('#counter'),status=document.querySelector('#status'),images=[...document.querySelectorAll('img')];let frame=0,running=false,last=0,cache=[];
function stop(){running=false;play.textContent='เล่น'}
function draw(){slider.value=frame;counter.textContent=`${frame+1}/${lengths[word.value]} (${(frame/30).toFixed(2)}s)`;images.forEach((img,i)=>img.src=`continuous_review_20261005/renderer/frames/${encodeURIComponent(word.value+'__'+modes[i])}/${String(frame).padStart(4,'0')}.png`)}
function load(){stop();frame=0;slider.max=lengths[word.value]-1;cache=[];let loaded=0,failed=0,total=lengths[word.value]*3;status.textContent='กำลังโหลดภาพ';for(const mode of modes)for(let j=0;j<lengths[word.value];j++){const im=new Image();im.onload=()=>{loaded++;status.textContent=`โหลด ${loaded}/${total} ภาพ · ผิดพลาด ${failed}`};im.onerror=()=>{failed++;status.textContent=`ภาพโหลดไม่สำเร็จ ${failed}`};im.src=`continuous_review_20261005/renderer/frames/${encodeURIComponent(word.value+'__'+mode)}/${String(j).padStart(4,'0')}.png`;cache.push(im)}draw()}
word.onchange=load;slider.oninput=()=>{stop();frame=Number(slider.value);draw()};play.onclick=()=>{if(frame===lengths[word.value]-1)frame=0;running=!running;play.textContent=running?'หยุด':'เล่น';last=performance.now()};document.querySelector('#prev').onclick=()=>{stop();frame=Math.max(0,frame-1);draw()};document.querySelector('#next').onclick=()=>{stop();frame=Math.min(lengths[word.value]-1,frame+1);draw()};function tick(now){if(running){const steps=Math.floor((now-last)*30*Number(speed.value)/1000);if(steps){frame=Math.min(lengths[word.value]-1,frame+steps);last+=steps*1000/(30*Number(speed.value));draw();if(frame===lengths[word.value]-1)stop()}}requestAnimationFrame(tick)}load();requestAnimationFrame(tick);
</script></html>

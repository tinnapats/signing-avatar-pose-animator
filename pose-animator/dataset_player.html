<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pose Animator - Dataset Player</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      padding: 20px;
      border-right: 1px solid #d9e2ec;
      background: #ffffff;
    }

    .sidebar h1 {
      margin: 0 0 8px 0;
      font-size: 20px;
    }

    .sidebar p {
      margin: 0 0 16px 0;
      color: #52606d;
      font-size: 13px;
      line-height: 1.4;
    }

    .control-block {
      margin-bottom: 14px;
    }

    .control-block label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334e68;
    }

    .control-block input,
    .control-block select,
    .control-block button {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #bcccdc;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .control-inline {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #486581;
      background: #f0f4f8;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 34px;
    }

    .viewer {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .canvas-wrap {
      width: min(92vw, 860px);
      aspect-ratio: 1 / 1;
      max-height: calc(100vh - 48px);
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      display: grid;
      place-items: center;
    }

    .illustration-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #d9e2ec;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pose Animator Dataset Player</h1>
      <p>Official pose-animator runtime with text input (old workflow) and JSON upload.</p>

      <div class="control-block">
        <label for="textPrompt">1) Type Text (old mode)</label>
        <input id="textPrompt" type="text" placeholder="e.g. hello thank you" />
      </div>

      <div class="control-block">
        <button id="generateBtn" type="button">Generate From Text</button>
      </div>

      <div class="control-block">
        <label>1b) Voice Input (Vosk EN)</label>
        <div class="control-row">
          <button id="micStartBtn" type="button">Start Mic</button>
          <button id="micStopBtn" type="button" disabled>Stop & Transcribe</button>
        </div>
      </div>

      <div class="control-block">
        <label for="sequenceFile">2) or Sequence JSON</label>
        <input id="sequenceFile" type="file" accept=".json" />
      </div>

      <div class="control-block">
        <label for="avatarSelect">3) Built-in Avatar <span style="font-weight: 400; color: #486581;">(signing build)</span></label>
        <select id="avatarSelect"></select>
      </div>

      <div class="control-block">
        <label for="avatarFile">or Drop / Upload SVG Avatar</label>
        <input id="avatarFile" type="file" accept=".svg" />
      </div>

      <div class="control-block">
        <div class="control-row">
          <button id="playBtn" type="button">Play</button>
          <button id="resetBtn" type="button">Reset</button>
        </div>
        <div class="control-inline">
          <label for="speed" style="margin: 0;">Speed</label>
          <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1" />
          <span id="speedLabel">1.00x</span>
        </div>
      </div>

      <div class="control-block">
        <label for="frameSlider">Frame</label>
        <input id="frameSlider" type="range" min="0" max="0" value="0" />
      </div>

      <div class="control-block">
        <label>
          <input id="loopCheck" type="checkbox" checked />
          Loop
        </label>
      </div>

      <div id="status" class="status">Load sequence JSON to start.</div>
    </aside>

    <main class="viewer">
      <div class="canvas-wrap">
        <canvas class="illustration-canvas"></canvas>
      </div>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "paper": "./paper-global.js"
      }
    }
  </script>
  <script src="./vendor/paper-full.min.js"></script>
  <script type="module" src="dataset_player.js?v=signing-avatar-1"></script>
</body>
</html>
